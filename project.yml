name: VideoAandM
options:
  bundleIdPrefix: com.patrickreed1616
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  VideoAandM:
    type: application
    platform: macOS
    sources:
      - path: VideoAandM
        excludes:
          - "Resources/Music"
          - "Resources/Music/**"
      # Folder reference so the bundle keeps the Music/ subdirectory (catalog.json + audio files).
      - path: VideoAandM/Resources/Music
        type: folder
        buildPhase: resources
    info:
      path: VideoAandM/Info.plist
      properties:
        CFBundleName: "Video A&M"
        CFBundleDisplayName: "Video A&M"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickreed1616.videoaandm
        PRODUCT_NAME: VideoAandM
        PRODUCT_MODULE_NAME: VideoAandM
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Personal local app: ad-hoc "Sign to Run Locally", no sandbox so dropped files,
        # ~/Music/VideoAandM and export destinations just work.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
